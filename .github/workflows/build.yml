name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Java 21 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile and run offline regression tests
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Load local JavaFX views (Linux virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum mvn --batch-mode --no-transfer-progress -Dpcbuilder.uiTests=true test
